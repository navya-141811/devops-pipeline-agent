services:
  - type: web
    name: devops-pipeline-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /tmp/deployments.db
      - key: HINDSIGHT_URL
        value: ""
